    <!-- Disabilita Service Worker (sviluppo e produzione) -->
    <script>
      if ('serviceWorker' in navigator) {
        // Disabilita tutti i service worker esistenti
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister().then(function() {
              console.log('Service Worker disabilitato');
            });
          }
        });
        // Blocca nuovi service worker
        navigator.serviceWorker.register = function() {
          return Promise.reject(new Error('Service Worker disabilitato'));
        };
      }
    </script>
