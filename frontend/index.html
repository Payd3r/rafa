<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="icon" type="image/png" href="/logo.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/logo-white.png" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Performance & SEO Meta Tags -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />
    
    <!-- Font preload -->
    <link rel="preload" href="/fonts/MADE TOMMY Regular_PERSONAL USE.otf" as="font" type="font/otf" crossorigin>
    <link rel="preload" href="/fonts/MADE TOMMY Bold_PERSONAL USE.otf" as="font" type="font/otf" crossorigin>
    
    <!-- Critical Images Preload -->
    <link rel="preload" href="/logo.png" as="image" type="image/png" />
    
    <!-- Critical CSS Inline (will be added by build process) -->
    <style>
      /* Critical CSS for above-the-fold content */
      body { margin: 0; font-family: 'MADE TOMMY', sans-serif; }
      #app { min-height: 100vh; }
      .loading-spin { animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    
    <title>Inside.FaraoStudio</title>
  </head>
  <body class="bg-white dark:bg-black text-black dark:text-white">
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Disabilita Service Worker in sviluppo -->
    <script>
      if ('serviceWorker' in navigator) {
        // Disabilita tutti i service worker esistenti
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister().then(function() {
              console.log('Service Worker disabilitato');
            });
          }
        });
        // Blocca nuovi service worker
        navigator.serviceWorker.register = function() {
          return Promise.reject(new Error('Service Worker disabilitato in sviluppo'));
        };
      }
    </script>
  </body>
</html>
