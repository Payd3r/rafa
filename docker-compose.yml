version: '3.8'

services:
  # Backend Node.js - CMS Admin
  sito-rafa-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: sito-rafa-backend
    restart: unless-stopped
    # Porta NON esposta pubblicamente - solo comunicazione interna via Nginx proxy
    environment:
      NODE_ENV: production
      ADMIN_USER: ${ADMIN_USER:-andrea}
      ADMIN_PASS: ${ADMIN_PASS:-andrea2004}
      PUBLIC_PATH: /usr/share/nginx/html
      SRC_PATH: ${PROD_SRC_PATH:-/app/src}
      DATA_PATH: ${PROD_DATA_PATH:-/app/data/projects.json}
      PORT: ${BACKEND_PORT:-3001}
    volumes:
      # Volume condiviso con frontend - backend scrive, frontend serve
      - public_assets:/usr/share/nginx/html
      # Volume persistente per il database JSON
      - ${BACKEND_DATA_VOLUME:-backend_data}:/app/data
    networks:
      - ${DOCKER_NETWORK:-web-proxy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:${BACKEND_PORT:-3001}/api/admin/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend React - sito-rafa
  sito-rafa:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # In produzione usa path relativo (reverse proxy gestisce /api/)
        - VITE_BACKEND_URL=
    container_name: sito-rafa
    restart: unless-stopped
    environment:
      NODE_ENV: production
    volumes:
      # Volume condiviso per file dinamici (projects.json, imageMeta.json, optimized/)
      - public_assets:/usr/share/nginx/html
    networks:
      - ${DOCKER_NETWORK:-web-proxy}
    depends_on:
      sito-rafa-backend:
        condition: service_healthy

volumes:
  public_assets:
    driver: local
  backend_data:
    driver: local

networks:
  web-proxy:
    external: true


